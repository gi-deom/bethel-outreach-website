<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 1200" role="img" aria-labelledby="title desc">
  <title id="title">Bethel Outreach and Prayer Center Logo</title>
  <desc id="desc">A purple and gold church crest with dove, globe, cross, Bible, and ribbon.</desc>
  <defs>
